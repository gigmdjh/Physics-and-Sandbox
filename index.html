<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#171923"><title>Physics and Sandbox</title>
<style>
:root{color-scheme:dark;--bg:#171923;--panel:#242735;--line:#3c4154;--text:#f4f5fb;--muted:#aeb4c8;--accent:#8ee3b2}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--text);touch-action:none}#app{height:100dvh;display:flex;flex-direction:column}header{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#202330;border-bottom:2px solid #08090e}.brand{font-weight:900;letter-spacing:.2px;font-size:15px}.brand span{color:var(--accent)}#status{font-size:11px;color:var(--muted)}#stage{position:relative;flex:1;min-height:0;background:#202330}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}#hint{position:absolute;top:10px;left:10px;background:#171923d9;border:1px solid #41465a;border-radius:8px;padding:7px 9px;color:#d5d9e8;font-size:11px;pointer-events:none}#toolbar{flex:none;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#202330;border-top:2px solid #08090e;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}button{font:inherit;color:var(--text);background:#303548;border:2px solid #454b62;border-bottom-width:4px;border-radius:9px;min-height:44px;padding:6px 3px;font-size:12px;font-weight:750;touch-action:manipulation}button:active{transform:translateY(2px);border-bottom-width:2px}button.active{background:#315c4a;border-color:#8ee3b2;color:#eafff2}#help{font-size:10px;color:var(--muted);text-align:center;padding:0 8px 7px;background:#202330}
</style></head><body><div id="app"><header><div class="brand">PHYSICS <span>&</span> SANDBOX</div><div id="status">픽셀 물리 실험실 · 0개</div></header><main id="stage"><canvas id="game"></canvas><div id="hint">버튼으로 생성 · 물체를 손가락으로 끌기</div></main><nav id="toolbar"><button data-tool="box" class="active">▧ 상자</button><button data-tool="person">▣ 사람</button><button data-tool="grab">✋ 이동</button><button data-tool="delete">✕ 삭제</button></nav><div id="help">사람은 네모난 신체 부위와 관절로 연결돼요. 바닥이나 물체에 부딪히며 움직입니다.</div></div>
<script>(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),status=document.getElementById('status');let W=320,H=500,dpr=1,tool='box',objects=[],links=[],nextId=1,drag=null,last=0;const gravity=.34,groundPad=24;
function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=Math.max(1,Math.floor(r.width));H=Math.max(1,Math.floor(r.height));canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false}window.addEventListener('resize',resize);resize();
function part(x,y,w,h,color,kind='part',group=null){const o={id:nextId++,x,y,px:x,py:y,w,h,color,kind,group};objects.push(o);return o}function spawnBox(x=W*.5,y=H*.3){const s=Math.max(24,Math.min(36,Math.floor(Math.min(W,H)*.075)));part(x,y,s,s,'#c98b50','box')}
function spawnPerson(x=W*.5,y=H*.27){const u=Math.max(13,Math.min(19,Math.floor(Math.min(W,H)*.035))),g=nextId++,p={};p.head=part(x,y,u,u,'#f0c49a','part',g);p.chest=part(x,y+u*1.25,u*1.25,u*1.25,'#4d91d1','part',g);p.waist=part(x,y+u*2.35,u*.95,u*.7,'#e2bd68','part',g);p.pelvis=part(x,y+u*3.05,u*1.15,u*.8,'#3e659d','part',g);p.thighL=part(x-u*.38,y+u*4,u*.7,u*1.25,'#426ca5','part',g);p.thighR=part(x+u*.38,y+u*4,u*.7,u*1.25,'#426ca5','part',g);p.shinL=part(x-u*.38,y+u*5.15,u*.62,u*1.15,'#7b9bb7','part',g);p.shinR=part(x+u*.38,y+u*5.15,u*.62,u*1.15,'#7b9bb7','part',g);p.footL=part(x-u*.65,y+u*5.85,u*.95,u*.48,'#30343e','part',g);p.footR=part(x+u*.65,y+u*5.85,u*.95,u*.48,'#30343e','part',g);p.armL=part(x-u*1.05,y+u*1.5,u*.65,u*1.2,'#4d91d1','part',g);p.armR=part(x+u*1.05,y+u*1.5,u*.65,u*1.2,'#4d91d1','part',g);p.forearmL=part(x-u*1.35,y+u*2.45,u*.65,u,'#f0c49a','part',g);p.forearmR=part(x+u*1.35,y+u*2.45,u*.65,u,'#f0c49a','part',g);p.handL=part(x-u*1.35,y+u*3.05,u*.48,u*.48,'#f0c49a','part',g);p.handR=part(x+u*1.35,y+u*3.05,u*.48,u*.48,'#f0c49a','part',g);const j=(a,b,d)=>links.push({a:p[a].id,b:p[b].id,d});j('head','chest',u*1.12);j('chest','waist',u*1.12);j('waist','pelvis',u*.8);j('pelvis','thighL',u);j('pelvis','thighR',u);j('thighL','shinL',u*1.15);j('thighR','shinR',u*1.15);j('shinL','footL',u*.82);j('shinR','footR',u*.82);j('chest','armL',u);j('chest','armR',u);j('armL','forearmL',u*.95);j('armR','forearmR',u*.95);j('forearmL','handL',u*.6);j('forearmR','handR',u*.6)}
const byId=id=>objects.find(o=>o.id===id);function physics(){for(const o of objects){if(drag&&drag.o.id===o.id)continue;const vx=(o.x-o.px)*.992,vy=(o.y-o.py)*.992;o.px=o.x;o.py=o.y;o.x+=vx;o.y+=vy+gravity;const floor=H-groundPad;if(o.y+o.h/2>floor){o.y=floor-o.h/2;if(o.y-o.py>0)o.py=o.y+vy*.18}if(o.x-o.w/2<0){o.x=o.w/2;o.px=o.x+vx*.2}if(o.x+o.w/2>W){o.x=W-o.w/2;o.px=o.x+vx*.2}}
for(let pass=0;pass<2;pass++){for(let i=0;i<objects.length;i++)for(let j=i+1;j<objects.length;j++){const a=objects[i],b=objects[j];if(drag&&(drag.o.id===a.id||drag.o.id===b.id))continue;if(a.group&&a.group===b.group)continue;const dx=b.x-a.x,dy=b.y-a.y,ox=(a.w+b.w)/2-Math.abs(dx),oy=(a.h+b.h)/2-Math.abs(dy);if(ox>0&&oy>0){if(ox<oy){const q=ox*.5*(dx>=0?1:-1);a.x-=q;b.x+=q;a.px-=q*.8;b.px+=q*.8}else{const q=oy*.5*(dy>=0?1:-1);a.y-=q;b.y+=q;a.py-=q*.8;b.py+=q*.8}}}for(const l of links){const a=byId(l.a),b=byId(l.b);if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,q=(d-l.d)/d*.5,cx=dx*q,cy=dy*q;if(!(drag&&drag.o.id===a.id)){a.x+=cx;a.y+=cy}if(!(drag&&drag.o.id===b.id)){b.x-=cx;b.y-=cy}}}for(const o of objects){const f=H-groundPad;if(o.y+o.h/2>f){o.y=f-o.h/2;o.py=Math.min(o.py,o.y+2)}}}
function rect(o,fill){const x=Math.round(o.x-o.w/2),y=Math.round(o.y-o.h/2),w=Math.max(2,Math.floor(o.w)),h=Math.max(2,Math.floor(o.h));ctx.fillStyle='#171923';ctx.fillRect(x-1,y-1,w+2,h+2);ctx.fillStyle=fill;ctx.fillRect(x,y,w,h)}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#202330';ctx.fillRect(0,0,W,H);ctx.fillStyle='#292e3d';for(let x=0;x<W;x+=16)for(let y=0;y<H;y+=16)if((x/16+y/16)%2===0)ctx.fillRect(x,y,1,1);const gy=H-groundPad;ctx.fillStyle='#171923';ctx.fillRect(0,gy,W,groundPad);ctx.fillStyle='#58634f';ctx.fillRect(0,gy,W,4);ctx.fillStyle='#82936b';for(let x=0;x<W;x+=12)ctx.fillRect(x,gy,6,2);for(const l of links){const a=byId(l.a),b=byId(l.b);if(!a||!b)continue;ctx.strokeStyle='#171923';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.strokeStyle='#d6b48b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}for(const o of objects){if(o.kind==='box'){const x=Math.round(o.x-o.w/2),y=Math.round(o.y-o.h/2),s=o.w;ctx.fillStyle='#171923';ctx.fillRect(x-2,y-2,s+4,s+4);ctx.fillStyle='#a86d3c';ctx.fillRect(x,y,s,s);ctx.fillStyle='#e4b06b';ctx.fillRect(x+3,y+3,s-6,4);ctx.fillRect(x+3,y+3,4,s-6);ctx.fillStyle='#80502f';ctx.fillRect(x+5,y+Math.floor(s/2)-2,s-10,4);ctx.fillRect(x+Math.floor(s/2)-2,y+5,4,s-10)}else{rect(o,o.color);if(o.group&&o.color==='#f0c49a'&&o.w>10&&o.h>10&&o.h<o.w*1.15){ctx.fillStyle='#382c2c';ctx.fillRect(Math.round(o.x-o.w*.22),Math.round(o.y-o.h*.12),3,3);ctx.fillRect(Math.round(o.x+o.w*.1),Math.round(o.y-o.h*.12),3,3)}}}status.textContent='픽셀 물리 실험실 · '+objects.length+'개 부위';requestAnimationFrame(draw)}function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function hit(p){for(let i=objects.length-1;i>=0;i--){const o=objects[i];if(Math.abs(p.x-o.x)<=o.w/2+4&&Math.abs(p.y-o.y)<=o.h/2+4)return o}return null}canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=pos(e),o=hit(p);if(tool==='delete'){if(o){const g=o.group;objects=objects.filter(v=>g?v.group!==g:v.id!==o.id);links=links.filter(l=>byId(l.a)&&byId(l.b))}return}if(tool==='box'){spawnBox(p.x,p.y);return}if(tool==='person'){spawnPerson(p.x,p.y);return}if(o){drag={o,dx:p.x-o.x,dy:p.y-o.y};canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e);drag.o.x=p.x-drag.dx;drag.o.y=p.y-drag.dy;drag.o.px=drag.o.x;drag.o.py=drag.o.y});const end=()=>drag=null;canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(q=>q.classList.toggle('active',q===b));if(tool==='box')spawnBox(W*.5,H*.25);if(tool==='person')spawnPerson(W*.5,H*.2)}));function loop(t){if(t-last>1000/30){physics();last=t}requestAnimationFrame(loop)}requestAnimationFrame(loop);requestAnimationFrame(draw);
})();</script></body></html>
