<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#171923"><title>Physics and Sandbox</title>
<style>
:root{color-scheme:dark;--bg:#171923;--panel:#242735;--line:#41465a;--text:#f4f5fb;--muted:#aeb4c8;--accent:#8ee3b2}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--text);touch-action:none}#app{height:100dvh;display:flex;flex-direction:column}header{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:#202330;border-bottom:2px solid #08090e}.iconbtn{width:42px;min-width:42px;height:40px;padding:0;font-size:22px;line-height:1;border-radius:9px}.brand{font-weight:900;letter-spacing:.2px;font-size:14px;white-space:nowrap}.brand span{color:var(--accent)}#status{margin-left:auto;font-size:10px;color:var(--muted);text-align:right}#stage{position:relative;flex:1;min-height:0;background:#202330;overflow:hidden}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}#rotateNotice{display:none;position:fixed;inset:0;z-index:20;background:#171923;color:#f4f5fb;align-items:center;justify-content:center;text-align:center;padding:24px}#rotateNotice .noticeCard{max-width:320px}#rotateNotice .rotateIcon{font-size:64px;line-height:1.3;display:block;margin-bottom:16px}#rotateNotice strong{display:block;font-size:22px;margin-bottom:10px}#rotateNotice p{font-size:14px;color:#aeb4c8;line-height:1.7;margin:0}@media (orientation:portrait){#rotateNotice{display:flex}#app{visibility:hidden}}#hint{position:absolute;bottom:9px;left:9px;max-width:calc(100% - 18px);background:#171923df;border:1px solid #41465a;border-radius:8px;padding:7px 9px;color:#d5d9e8;font-size:10px;pointer-events:none}#drawer{position:absolute;z-index:4;left:0;top:0;bottom:0;width:min(290px,86vw);background:#202330;border-right:2px solid #08090e;box-shadow:12px 0 30px #0008;transform:translateX(-105%);transition:transform .2s ease;display:flex;flex-direction:column}#drawer.open{transform:translateX(0)}.drawerhead{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line);font-weight:850}.tabs{display:flex;gap:6px;padding:9px;overflow-x:auto;border-bottom:1px solid var(--line)}.tab{flex:1;min-width:68px;min-height:38px}.tab.active{background:#315c4a;border-color:#8ee3b2}.catalog{padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;overflow:auto}.item{min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:#2b3041;border:1px solid #454b62;border-radius:10px;touch-action:none}.item:active{background:#3b4258}.preview{width:34px;height:30px;display:flex;align-items:center;justify-content:center;font-size:24px}.item small{font-size:11px;color:#e6e9f3}.scrim{position:absolute;inset:0;background:#0007;z-index:3;display:none}.scrim.show{display:block}button{font:inherit;color:var(--text);background:#303548;border:2px solid #454b62;border-bottom-width:4px;border-radius:9px;min-height:42px;padding:6px 7px;font-size:12px;font-weight:750;touch-action:manipulation}button:active{transform:translateY(2px);border-bottom-width:2px}#toolbar{flex:none;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#202330;border-top:2px solid #08090e;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}#toolbar button{min-height:40px}#help{font-size:10px;color:var(--muted);text-align:center;padding:0 8px 6px;background:#202330}
</style></head><body><div id="rotateNotice"><div class="noticeCard"><span class="rotateIcon">📱 ↻</span><strong>가로 화면으로 플레이해 주세요</strong><p>이 게임은 가로 화면 전용입니다.<br>휴대전화를 가로로 돌려 주세요.</p></div></div><div id="app"><header><button id="menuBtn" class="iconbtn" aria-label="물건 목록 열기">☰</button><div class="brand">PHYSICS <span>&</span> SANDBOX</div><div id="status">물리 실험실 · 0개</div></header><main id="stage"><canvas id="game"></canvas><div id="hint">물체를 끌어 이동 · 빈 곳을 끌어 화면 이동 · 두 손가락 확대/축소</div><div id="scrim" class="scrim"></div><aside id="drawer"><div class="drawerhead"><span>물건 꺼내기</span><button id="closeDrawer" class="iconbtn" aria-label="닫기">×</button></div><div class="tabs"><button class="tab active" data-cat="all">전체</button><button class="tab" data-cat="people">사람</button><button class="tab" data-cat="objects">물체</button></div><div id="catalog" class="catalog"></div></aside></main><nav id="toolbar"><button data-tool="grab" class="active">✋ 이동</button><button data-tool="delete">✕ 삭제</button><button id="resetBtn">↺ 초기화</button><button id="homeBtn">⌂ 방 보기</button></nav><div id="help">물건 목록에서 아이템을 끌어 방 안에 놓으면 생성됩니다.</div></div>
<script>(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),status=document.getElementById('status'),drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim'),catalog=document.getElementById('catalog');
let W=320,H=500,dpr=1,tool='grab',objects=[],links=[],nextId=1,drag=null,camera={x:900,y:650,zoom:.7},pointers=new Map(),gesture=null,preview=null,activeCat='all',last=0;
const ROOM={w:1800,h:1300,wall:42},gravity=.38,items=[{id:'person',cat:'people',name:'사람',icon:'🧍'},{id:'box',cat:'objects',name:'나무 상자',icon:'▧'},{id:'ball',cat:'objects',name:'공',icon:'●'},{id:'crate',cat:'objects',name:'큰 상자',icon:'▤'}];
function requestLandscape(){try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(_){}}window.addEventListener('pointerdown',requestLandscape,{once:true});function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=Math.max(1,Math.floor(r.width));H=Math.max(1,Math.floor(r.height));canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
const screenToWorld=p=>({x:(p.x-W/2)/camera.zoom+camera.x,y:(p.y-H/2)/camera.zoom+camera.y}),worldToScreen=p=>({x:(p.x-camera.x)*camera.zoom+W/2,y:(p.y-camera.y)*camera.zoom+H/2});
function part(x,y,w,h,color,kind='part',group=null,shape='rect'){const o={id:nextId++,x,y,px:x,py:y,w,h,color,kind,group,shape};objects.push(o);return o}
function spawnBox(x,y,size=38){part(x,y,size,size,'#c98b50','box',null,'box')}
function spawnBall(x,y){part(x,y,28,28,'#f06d65','ball',null,'circle')}
function spawnCrate(x,y){part(x,y,68,58,'#9c744c','crate',null,'box')}
function spawnPerson(x,y){const u=16,g=nextId++,p={};p.head=part(x,y,u,u,'#f0c49a','part',g);p.chest=part(x,y+u*1.2,u*1.35,u*1.3,'#4d91d1','part',g);p.waist=part(x,y+u*2.35,u,u*.65,'#e2bd68','part',g);p.pelvis=part(x,y+u*3,u*1.15,u*.8,'#3e659d','part',g);p.thighL=part(x-u*.38,y+u*3.85,u*.72,u*1.15,'#426ca5','part',g);p.thighR=part(x+u*.38,y+u*3.85,u*.72,u*1.15,'#426ca5','part',g);p.shinL=part(x-u*.4,y+u*4.95,u*.58,u*1.1,'#7b9bb7','part',g);p.shinR=part(x+u*.4,y+u*4.95,u*.58,u*1.1,'#7b9bb7','part',g);p.footL=part(x-u*.68,y+u*5.65,u*.95,u*.42,'#30343e','part',g);p.footR=part(x+u*.68,y+u*5.65,u*.95,u*.42,'#30343e','part',g);p.armL=part(x-u*1.05,y+u*1.35,u*.62,u*1.12,'#4d91d1','part',g);p.armR=part(x+u*1.05,y+u*1.35,u*.62,u*1.12,'#4d91d1','part',g);p.forearmL=part(x-u*1.3,y+u*2.25,u*.6,u*.95,'#f0c49a','part',g);p.forearmR=part(x+u*1.3,y+u*2.25,u*.6,u*.95,'#f0c49a','part',g);p.handL=part(x-u*1.4,y+u*2.9,u*.46,u*.46,'#f0c49a','part',g);p.handR=part(x+u*1.4,y+u*2.9,u*.46,u*.46,'#f0c49a','part',g);
const joint=(a,b,d,stiff=.72)=>links.push({a:p[a].id,b:p[b].id,d,stiff});
joint('head','chest',u*1.1,.86);joint('chest','waist',u*1.05,.8);joint('waist','pelvis',u*.72,.85);joint('pelvis','thighL',u*.95,.72);joint('pelvis','thighR',u*.95,.72);joint('thighL','shinL',u*1.08,.65);joint('thighR','shinR',u*1.08,.65);joint('shinL','footL',u*.76,.75);joint('shinR','footR',u*.76,.75);joint('chest','armL',u*.94,.65);joint('chest','armR',u*.94,.65);joint('armL','forearmL',u*.9,.6);joint('armR','forearmR',u*.9,.6);joint('forearmL','handL',u*.58,.65);joint('forearmR','handR',u*.58,.65)}
const byId=id=>objects.find(o=>o.id===id);
function clampRoom(o){const r=ROOM.wall;const minX=r+o.w/2,maxX=ROOM.w-r-o.w/2,minY=r+o.h/2,maxY=ROOM.h-r-o.h/2;if(o.x<minX){o.x=minX;o.px=o.x}if(o.x>maxX){o.x=maxX;o.px=o.x}if(o.y<minY){o.y=minY;o.py=o.y}if(o.y>maxY){o.y=maxY;o.py=o.y}}
function physics(){for(const o of objects){if(drag&&drag.type==='object'&&(drag.o.group?drag.o.group===o.group:o.id===drag.o.id))continue;const vx=(o.x-o.px)*.985,vy=(o.y-o.py)*.985;o.px=o.x;o.py=o.y;o.x+=vx;o.y+=vy+gravity;o.x=Math.max(ROOM.wall+o.w/2,Math.min(ROOM.w-ROOM.wall-o.w/2,o.x));o.y=Math.max(ROOM.wall+o.h/2,Math.min(ROOM.h-ROOM.wall-o.h/2,o.y));if(o.x===ROOM.wall+o.w/2||o.x===ROOM.w-ROOM.wall-o.w/2)o.px=o.x+vx*.15;if(o.y===ROOM.wall+o.h/2||o.y===ROOM.h-ROOM.wall-o.h/2)o.py=o.y+vy*.15}
for(let pass=0;pass<4;pass++){for(let i=0;i<objects.length;i++)for(let j=i+1;j<objects.length;j++){const a=objects[i],b=objects[j];if(a.group&&a.group===b.group)continue;if(drag&&drag.type==='object'&&(drag.o.group===a.group&&drag.o.group||drag.o.id===a.id||drag.o.id===b.id))continue;const dx=b.x-a.x,dy=b.y-a.y,ox=(a.w+b.w)/2-Math.abs(dx),oy=(a.h+b.h)/2-Math.abs(dy);if(ox>0&&oy>0){if(ox<oy){const q=ox*.5*(dx>=0?1:-1);a.x-=q;b.x+=q;a.px-=q*.55;b.px+=q*.55}else{const q=oy*.5*(dy>=0?1:-1);a.y-=q;b.y+=q;a.py-=q*.55;b.py+=q*.55}}}
for(const l of links){const a=byId(l.a),b=byId(l.b);if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,q=(d-l.d)/d*l.stiff*.5,cx=dx*q,cy=dy*q;if(!(drag&&drag.type==='object'&&(drag.o.group?drag.o.group===a.group:drag.o.id===a.id))){a.x+=cx;a.y+=cy}if(!(drag&&drag.type==='object'&&(drag.o.group?drag.o.group===b.group:drag.o.id===b.id))){b.x-=cx;b.y-=cy}}}
for(const o of objects)clampRoom(o)}
function drawPart(o,alpha=1){const p=worldToScreen(o),w=Math.max(2,o.w*camera.zoom),h=Math.max(2,o.h*camera.zoom);ctx.globalAlpha=alpha;if(o.shape==='circle'||o.kind==='ball'){ctx.fillStyle='#171923';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(w,h)/2+2,0,Math.PI*2);ctx.fill();ctx.fillStyle=o.color;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(w,h)/2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff55';ctx.fillRect(p.x-w*.18,p.y-h*.25,Math.max(2,w*.22),Math.max(2,h*.12))}else{const x=Math.round(p.x-w/2),y=Math.round(p.y-h/2);ctx.fillStyle='#11131b';ctx.fillRect(x-1,y-1,w+2,h+2);ctx.fillStyle=o.color;ctx.fillRect(x,y,w,h);if(o.shape==='box'||o.kind==='box'||o.kind==='crate'){ctx.fillStyle='#ffffff33';ctx.fillRect(x+3,y+3,Math.max(1,w-6),Math.max(2,h*.12));ctx.strokeStyle='#5b3826';ctx.lineWidth=Math.max(1,2*camera.zoom);ctx.strokeRect(x+2,y+2,w-4,h-4);ctx.beginPath();ctx.moveTo(x+w/2,y+3);ctx.lineTo(x+w/2,y+h-3);ctx.stroke()}}ctx.globalAlpha=1}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#202330';ctx.fillRect(0,0,W,H);const top=worldToScreen({x:0,y:0}),bottom=worldToScreen({x:ROOM.w,y:ROOM.h});ctx.save();ctx.beginPath();ctx.rect(Math.max(0,top.x),Math.max(0,top.y),Math.min(W,bottom.x)-Math.max(0,top.x),Math.min(H,bottom.y)-Math.max(0,top.y));ctx.clip();const step=32*camera.zoom;if(step>5){ctx.strokeStyle='#ffffff0a';ctx.lineWidth=1;ctx.beginPath();for(let x=Math.ceil((camera.x-W/(2*camera.zoom))/32)*32;x<camera.x+W/(2*camera.zoom);x+=32){const sx=worldToScreen({x,y:0}).x;ctx.moveTo(sx,0);ctx.lineTo(sx,H)}for(let y=Math.ceil((camera.y-H/(2*camera.zoom))/32)*32;y<camera.y+H/(2*camera.zoom);y+=32){const sy=worldToScreen({x:0,y}).y;ctx.moveTo(0,sy);ctx.lineTo(W,sy)}ctx.stroke()}
ctx.fillStyle='#171923';ctx.fillRect(top.x,top.y,ROOM.w*camera.zoom,ROOM.h*camera.zoom);ctx.fillStyle='#303746';ctx.fillRect(top.x+ROOM.wall*camera.zoom,top.y+ROOM.wall*camera.zoom,(ROOM.w-ROOM.wall*2)*camera.zoom,(ROOM.h-ROOM.wall*2)*camera.zoom);
const innerX=top.x+ROOM.wall*camera.zoom,innerY=top.y+ROOM.wall*camera.zoom,innerW=(ROOM.w-ROOM.wall*2)*camera.zoom,innerH=(ROOM.h-ROOM.wall*2)*camera.zoom;ctx.fillStyle='#394052';for(let x=innerX;x<innerX+innerW;x+=24*camera.zoom)for(let y=innerY;y<innerY+innerH;y+=24*camera.zoom)if((Math.floor(x/(24*camera.zoom))+Math.floor(y/(24*camera.zoom)))%2===0)ctx.fillRect(x,y,Math.max(1,camera.zoom*2),Math.max(1,camera.zoom*2));
for(const l of links){const a=byId(l.a),b=byId(l.b);if(!a||!b)continue;const pa=worldToScreen(a),pb=worldToScreen(b);ctx.strokeStyle='#171923';ctx.lineWidth=Math.max(2,4*camera.zoom);ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();ctx.strokeStyle='#d6b48b';ctx.lineWidth=Math.max(1,2*camera.zoom);ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke()}
for(const o of objects)drawPart(o);
if(preview){const ghost={...preview.itemObject};const p=screenToWorld(preview.screen);ghost.x=p.x;ghost.y=p.y;drawPart(ghost,.48)}
ctx.restore();status.textContent='물리 실험실 · '+objects.length+'개 부위 · '+Math.round(camera.zoom*100)+'%';requestAnimationFrame(draw)}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function hit(p){const w=screenToWorld(p);for(let i=objects.length-1;i>=0;i--){const o=objects[i];if(Math.abs(w.x-o.x)<=o.w/2+5&&Math.abs(w.y-o.y)<=o.h/2+5)return o}return null}
function openDrawer(){drawer.classList.add('open');scrim.classList.add('show')}function closeDrawer(){drawer.classList.remove('open');scrim.classList.remove('show');preview=null}
document.getElementById('menuBtn').onclick=openDrawer;document.getElementById('closeDrawer').onclick=closeDrawer;scrim.onclick=closeDrawer;
function buildCatalog(){catalog.innerHTML='';for(const item of items.filter(i=>activeCat==='all'||i.cat===activeCat)){const el=document.createElement('button');el.className='item';el.innerHTML='<span class="preview">'+item.icon+'</span><small>'+item.name+'</small>';el.addEventListener('pointerdown',e=>{e.preventDefault();const r=stage.getBoundingClientRect();preview={item,screen:{x:e.clientX-r.left,y:e.clientY-r.top},itemObject:item.id==='person'?{x:0,y:0,w:16,h:16,color:'#f0c49a'}:item.id==='box'?{x:0,y:0,w:38,h:38,color:'#c98b50',shape:'box'}:item.id==='crate'?{x:0,y:0,w:68,h:58,color:'#9c744c',shape:'box'}:{x:0,y:0,w:28,h:28,color:'#f06d65',shape:'circle',kind:'ball'}};const move=ev=>{const rr=stage.getBoundingClientRect();preview.screen={x:ev.clientX-rr.left,y:ev.clientY-rr.top}};const up=ev=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);if(preview){const r2=stage.getBoundingClientRect(),s={x:ev.clientX-r2.left,y:ev.clientY-r2.top};if(s.x>=0&&s.y>=0&&s.x<W&&s.y<H){const w=screenToWorld(s);if(item.id==='person')spawnPerson(w.x,w.y-20);if(item.id==='box')spawnBox(w.x,w.y);if(item.id==='ball')spawnBall(w.x,w.y);if(item.id==='crate')spawnCrate(w.x,w.y)}preview=null;closeDrawer()}};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)});catalog.appendChild(el)}}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(q=>q.classList.toggle('active',q===b));buildCatalog()});buildCatalog();
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);const p=pos(e);pointers.set(e.pointerId,p);if(pointers.size===2){const a=[...pointers.values()];gesture={type:'pinch',dist:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),zoom:camera.zoom,camera:{...camera},mid:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},world:screenToWorld({x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2})};drag=null;return}if(pointers.size>1)return;const o=hit(p);if(tool==='delete'){if(o){const g=o.group;objects=objects.filter(v=>g?v.group!==g:v.id!==o.id);links=links.filter(l=>byId(l.a)&&byId(l.b))}return}if(o){drag={type:'object',o,group:o.group,dx:screenToWorld(p).x-o.x,dy:screenToWorld(p).y-o.y};return}drag={type:'pan',start:p,camera:{...camera}}});
canvas.addEventListener('pointermove',e=>{const p=pos(e);if(pointers.has(e.pointerId))pointers.set(e.pointerId,p);if(gesture&&pointers.size>=2){const a=[...pointers.values()],dist=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};camera.zoom=Math.max(.32,Math.min(1.8,gesture.zoom*dist/Math.max(1,gesture.dist)));const at=screenToWorld(mid);camera.x+=gesture.world.x-at.x;camera.y+=gesture.world.y-at.y;return}if(!drag)return;if(drag.type==='pan'){camera.x=drag.camera.x-(p.x-drag.start.x)/camera.zoom;camera.y=drag.camera.y-(p.y-drag.start.y)/camera.zoom;return}const w=screenToWorld(p),members=drag.group?objects.filter(o=>o.group===drag.group):[drag.o];const dx=w.x-drag.dx-drag.o.x,dy=w.y-drag.dy-drag.o.y;for(const o of members){o.x+=dx;o.y+=dy;o.px=o.x;o.py=o.y;clampRoom(o)}});
function pointerEnd(e){pointers.delete(e.pointerId);if(pointers.size<2)gesture=null;if(pointers.size===0)drag=null}canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',pointerEnd);
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(q=>q.classList.toggle('active',q===b))}));
document.getElementById('resetBtn').onclick=()=>{objects=[];links=[];nextId=1;camera={x:900,y:650,zoom:.7}};document.getElementById('homeBtn').onclick=()=>{camera={x:900,y:650,zoom:Math.min(W/900,H/650,.85)}};function loop(t){if(t-last>1000/30){physics();last=t}requestAnimationFrame(loop)}requestAnimationFrame(loop);requestAnimationFrame(draw);
})();</script></body></html>
